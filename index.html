<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành sử dụng CSS</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #f4f7fb;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 32px;
            background-color: #ffffff;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(31, 52, 73, 0.08);
        }

        h1 {
            margin-top: 0;
            color: blue;
            font-family: Tahoma, sans-serif;
            font-size: 200%;
        }

        p {
            color: red;
            font-family: Arial, sans-serif;
            font-size: 120%;
            line-height: 1.5;
            border: 1px solid grey;
            padding: 10px;
            background-color: #fffafa;
        }

        #element1 {
            color: blue;
            border-color: blue;
            background-color: #f0f6ff;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Đây là đề mục</h1>

        <p>Đây là đoạn văn bản.</p>
        <p>Đây là đoạn văn bản.</p>
        <p>Đây là đoạn văn bản.</p>
        <p id="element1">Đoạn văn bản có thuộc tính id</p>
    </main>
</body>
</html>
